<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Charset and Viewport -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />

  <!-- Primary Meta Tags (SEO) -->
  <title>EzzyStay | Rent Verified Apartments & Rooms Online</title>
  <meta name="title" content="EzzyStay | Rent Verified Apartments & Rooms Online" />
  <meta name="description"
    content="Discover verified rental properties, connect with trusted landlords, and secure your next home with EzzyStay. Browse thousands of apartments and rooms with transparent pricing and 24/7 support." />
  <meta name="keywords"
    content="rental housing, apartment rentals, room rentals, housing anywhere, landlord, tenant, secure rental, ezzy stay, long term rental" />
  <meta name="author" content="EzzyStay" />
  <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
  <meta name="googlebot" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
  <meta name="language" content="English" />
  <meta name="theme-color" content="#0F2D36" />

  <!-- Canonical URL -->
  <link rel="canonical" href="https://ezzystay.com/" />

  <!-- Open Graph Meta Tags (Social Media) -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://ezzystay.com/" />
  <meta property="og:title" content="EzzyStay - Find & Rent Verified Apartments Online" />
  <meta property="og:description"
    content="Discover verified rental properties, connect with trusted landlords, and secure your next home with EzzyStay." />
  <meta property="og:image" content="https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?w=1200&q=80" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="EzzyStay Housing Platform" />
  <meta property="og:locale" content="en_US" />

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://ezzystay.com/" />
  <meta name="twitter:title" content="EzzyStay - Find & Rent Verified Apartments Online" />
  <meta name="twitter:description"
    content="Discover verified rental properties and connect with trusted landlords on EzzyStay." />
  <meta name="twitter:image" content="https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?w=1200&q=80" />

  <!-- Additional Meta Tags -->
  <meta name="format-detection" content="telephone=no" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="EzzyStay" />

  <!-- Favicons -->
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="shortcut icon" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <link rel="manifest" href="/manifest.json" />

  <!-- Preconnect to External Resources -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- JSON-LD Structured Data -->
  <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "EzzyStay",
        "url": "https://ezzystay.com",
        "description": "Trusted housing rental platform connecting tenants with verified landlords worldwide.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://ezzystay.com/listings?search={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
  </script>

  <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "RealEstateAgent",
        "name": "EzzyStay",
        "url": "https://ezzystay.com",
        "description": "A trusted housing rental platform for finding verified apartments and rooms with 24/7 tenant protection.",
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "Customer Support",
          "email": "support@ezzystay.com",
          "url": "https://ezzystay.com/contact"
        }
      }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
